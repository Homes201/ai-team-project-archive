<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome BRT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        img {
            width: 400px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2em;
            color: #333;
        }

        p {
            font-size: 1.2em;
            color: #555;
        }

        input[type="text"] {
            font-size: 18px;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #4CAF50;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            width: 80%;
            margin-bottom: 20px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
        
        #result {
            width: 80%;
            margin-top: 20px;
            margin-left: auto;
            margin-right: auto;
        }

        .warning {
            background-color: #ff9800;
            color: white;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
        }

        .faq-section {
            margin-top: 30px;
            text-align: left;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }

        .faq {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
        }

        .faq:hover {
            background-color: #f9f9f9;
        }

        .faq-content {
            display: none;
            padding: 10px;
            color: #555;
        }
    </style>
    <script>
        function toggleFAQ(index) {
            const content = document.getElementById(`faq-content-${index}`);
            content.style.display = content.style.display === 'block' ? 'none' : 'block';
        }

        function findAnswer() {
            const question = document.getElementById('question').value;
            const result = document.getElementById('result');

            if (question.trim() === "") {
                result.textContent = "💡 질문을 입력해 주세요.";
            } else {
                result.textContent = "답변을 찾는 중입니다...";

                fetch('/query/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify({ query: question })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.response) {
                        result.textContent = data.response;
                    } else if (data.error) {
                        result.textContent = data.error;
                    }
                })
                .catch(error => {
                    result.textContent = "연결 오류가 발생했습니다.";
                });
            }
        }
    </script>
</head>
<body>
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
    <img src="https://github.com/user-attachments/assets/44e55662-1d8e-4159-8834-72b135461411" alt="Logo">
    <h1>🤖 Welcome on board</h1>
    <p>사수에게 물어보기 애매한 사항들을 질문해주세요 😊</p>
    <p>가상 문서로 동작하는 시연용 화면입니다. 실제 회사 규정으로 사용하지 마세요.</p>

    <input type="text" id="question" placeholder="질문을 입력하세요 (최대 500자)" maxlength="500">
    <br>
    <button onclick="findAnswer()">🔍 답변 찾기</button>
    <div id="result"></div>

    <div class="faq-section">
        <h2>자주 묻는 질문 (FAQ)</h2>
        <div class="faq" onclick="toggleFAQ(1)">
            Q1: 휴가는 어떻게 신청하나요?
        </div>
        <div class="faq-content" id="faq-content-1">
            A: 가상 시연 문서에서는 희망 날짜를 입력하고 담당자의 승인을 기다립니다.
        </div>

        <div class="faq" onclick="toggleFAQ(2)">
            Q2: 교육은 어떻게 신청하나요?
        </div>
        <div class="faq-content" id="faq-content-2">
            A: 가상 시연 문서에서는 교육 담당자에게 교육명과 희망 일정을 전달합니다.
        </div>

    </div>
</body>
</html>
